<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work It Browser: Lift Your Connection</title>
  <link rel="stylesheet" href="style-7.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap" rel="stylesheet">

</head>
<body>

  <main class="browser-window">
    
    <div class="tab-bar">
      <div class="tab active" onclick="openTab(event, 'page1')">
        <i class="fa-solid fa-dumbbell"></i> Main Gym
      </div>
      <div class="tab" onclick="openTab(event, 'page2')">
        <i class="fa-solid fa-globe"></i> Neocities
      </div>
      <div class="tab" onclick="openTab(event, 'page3')">
        <i class="fa-solid fa-video"></i> VloggerU
      </div>
      <div class="new-tab-btn" onclick="alert('Adding a new workout tab!')">+</div>
    </div>

    <article class="browser-header">
      <article class="controls">
        <button class="nav-btn" title="Back" onclick="goHome()">&#8592;</button>
        <button class="nav-btn" title="Forward">&#8594;</button>
        <button class="nav-btn" title="Refresh" onclick="refreshPage()">&#8635;</button>
        <button class="nav-btn" title="Home" onclick="goHome()">&#8962;</button>
      </article>
      
      <article class="address-bar">
        <input type="text" id="url-display" value="sptth://search.WorkitBrowser.com/search?" readonly>
      </article>
    </article>

    <article class="browser-content">
      
      <div id="page1" class="page active">
        <article class="search-container">
          <h1 class="brand-title"><i class="fa-solid fa-dumbbell"></i> Work It Browser</h1>
          <p class="brand-tagline">Open(source) • Heavy(equipped) • Fast(results) • Private(no one but you)</p>
          
          <input type="text" class="mock-search-bar" placeholder="Lift your queries here..." id="main-search-input">

          <article class="suggestions">
            <div class="suggestion-chip" onclick="performSearch('who are you?')">🏋️ who are you?</div>
            <div class="suggestion-chip" onclick="performSearch('whats this site?')">🌐 whats this site?</div>
            <div class="suggestion-chip" onclick="performSearch('latest updates?')">⚡ latest updates?</div>
            <div class="suggestion-chip" onclick="performSearch('funfacts?')">💡 funfacts?</div>
          </article>
        </article>
      </div>

      <div id="page2" class="page">
        <iframe src="https://neocities.org/browse" class="iframe-container" title="Neocities Browse"></iframe>
      </div>

      <div id="page3" class="page">
        <h1>VloggerU Channel</h1>
        <p style="margin-top:10px;">Check out my latest video logs and diary entries.</p>
      </div>

      <div id="page-results" class="page">
        <div id="dynamic-content-area" class="custom-content"></div>
      </div>

    </article>

  </main>

  <script>
    function openTab(evt, pageName) {
      var i, page, tabs;
      
      page = document.getElementsByClassName("page");
      for (i = 0; i < page.length; i++) {
        page[i].classList.remove("active");
      }

      tabs = document.getElementsByClassName("tab");
      for (i = 0; i < tabs.length; i++) {
        tabs[i].classList.remove("active");
      }

      document.getElementById(pageName).classList.add("active");
      evt.currentTarget.classList.add("active");

      const urls = { 
        'page1': 'sptth://search.WorkitBrowser.com/search?', 
        'page2': 'https://neocities.org/browse', 
        'page3': 'sptth://search.WorkitBrowser.com/VloggerU' 
      };
      document.getElementById('url-display').value = urls[pageName];
    }

    const searchDatabase = {
      'who are you?': `
        <h2>Who am I?</h2>
        <p style="margin-top: 10px;">I am a <strong>gym-powered webmaster</strong> built entirely with HTML, CSS, and JavaScript.</p>
        <p style="margin-top: 10px;">I run completely offline inside this custom browser frame!</p>
        <button class="back-btn" onclick="goHome()">Back to Search</button>
      `,
      'whats this site?': `
        <h2>What's this site?</h2>
        <p style="margin-top: 10px;">This is <strong>Work It Browser</strong> — a custom simulated desktop browser designed with a gym theme, interactive tab navigation, and embedded web browsing capability.</p>
        <button class="back-btn" onclick="goHome()">Back to Search</button>
      `,
      'latest updates?': `
        <h2>Latest Updates</h2>
        <ul style="margin-top: 10px; padding-left: 20px; line-height: 1.6;">
          <li>Embedded active Neocities browse iframe directly into Tab 2.</li>
          <li>Updated address bar to reflect external URLs when navigating pages.</li>
          <li>Cleaned up taskbar for a dedicated browser application experience.</li>
        </ul>
        <button class="back-btn" onclick="goHome()">Back to Search</button>
      `,
      'funfacts?': `
        <h2>Fun Facts!</h2>
        <ul style="margin-top: 10px; padding-left: 20px; line-height: 1.6;">
          <li>Dumbbells were originally used in ancient Greece as jumping weights called 'halteres'.</li>
          <li>Working out boosts brain endorphins and helps code execute 100% faster (probably)!</li>
        </ul>
        <button class="back-btn" onclick="goHome()">Back to Search</button>
      `
    };

    function performSearch(queryKey) {
      const contentArea = document.getElementById('dynamic-content-area');
      const pageResults = document.getElementById('page-results');
      const pageHome = document.getElementById('page1');
      const urlDisplay = document.getElementById('url-display');

      const content = searchDatabase[queryKey];

      if (content) {
        contentArea.innerHTML = content;
        pageHome.classList.remove('active');
        pageResults.classList.add('active');
        urlDisplay.value = `workit://search/${encodeURIComponent(queryKey)}`;
      } else {
        contentArea.innerHTML = `<h2>Not Found</h2><p style="margin-top:10px;">No workout records found for "${queryKey}"</p><button class="back-btn" onclick="goHome()">Back</button>`;
        pageHome.classList.remove('active');
        pageResults.classList.add('active');
      }
    }

    function goHome() {
      document.getElementById('page-results').classList.remove('active');
      document.getElementById('page1').classList.add('active');
      document.getElementById('url-display').value = 'sptth://search.WorkitBrowser.com/search?';
      document.getElementById('main-search-input').value = '';
    }

    function refreshPage() {
      const currentActive = document.querySelector('.page.active');
      currentActive.style.opacity = '0.3';
      setTimeout(() => {
        currentActive.style.opacity = '1';
      }, 250);
    }

    document.getElementById('main-search-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        const val = this.value.toLowerCase().trim();
        if (searchDatabase[val]) {
          performSearch(val);
        } else {
          alert('Try clicking one of the suggested query chips below!');
        }
      }
    });
  </script>
</body>
</html>
